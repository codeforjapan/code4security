id: pkgname
level: 2
title: 依存パッケージを足すときは、名前の綴りと公開元を確かめている
when: [deps]
risk: 人気のパッケージに似せた名前の偽物や、AI が勧めた実在しない名前を誰かが後から登録したパッケージを入れると、インストールしただけでキーなどを盗まれることがあります。
why: 足す前に名前の綴りと公式のリポジトリを確かめれば、偽物の多くは避けられます。足すのを本当に必要なものだけにすれば、確かめる手間も、乗っ取られる入口も減ります。
how:
  - text: AI や記事が勧めたパッケージは、名前が公式の案内と一字一句同じか、パッケージのページから公式のリポジトリに辿れるかを確かめてから入れます。
  - command: npm view <パッケージ名> repository.url
related: [openssfGuide]
evidence:
  - source: openssfGuide
    checked: '2026-10-15'
    note: 直接の依存は、名前の綴りを確かめ、正しい取得元から入れる

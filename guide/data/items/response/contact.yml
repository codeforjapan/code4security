id: contact
level: 2
title: インシデントのとき、誰が判断して誰に連絡するかが決まっている
when: []
risk: 漏えいが起きてから「誰が止めるのか」「どこに連絡するのか」を決めていると、その間も被害が広がります。自治体などと組んでいる場合、報告の遅れはそのまま信頼の問題になります。
why: 判断する人と連絡先を先に決めておけば、最初の 1 時間で動けます。個人情報が漏れた場合は、個人情報保護委員会への報告と本人への通知が必要になることがあります。委員会への速報は、漏えいを知ってから概ね 3〜5 日以内が目安です。
how:
  - text: 判断する人と連絡先を 1 枚にまとめ、README から辿れるようにします。
related: [ppcLeak, ppcGuideline]
evidence:
  - source: ppcGuideline
    checked: '2026-10-15'
    note: 委員会への速報は、知ってから概ね 3〜5 日以内が目安

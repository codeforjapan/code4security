id: gitleaks
level: 2
title: 非公開リポジトリのコミット履歴に、キーが残っていないか調べた
when: [private]
risk: ファイルから消したキーも、コミット履歴には残っています。非公開リポジトリを公開に切り替えたときや、メンバーの PC から漏れたときに、まとめて他人の目に触れます。
why: 公開リポジトリは、GitHub の secret scanning が全ブランチの履歴まで自動で調べます。非公開リポジトリは、organization が Team 以上のプランで GitHub Secret Protection を契約しないと調べられないので、無料のツールで履歴まで調べます。
how:
  - command: gitleaks git -v --redact .
  - title: gitleaks
    url: https://github.com/gitleaks/gitleaks
related: [ghSecretScanning, ghPricing]
evidence:
  - source: ghSecretScanning
    checked: '2026-10-15'
    note: 全ブランチのコミット履歴まで調べる。個人アカウントの非公開リポジトリでは使えない

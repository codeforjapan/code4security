id: aitools
level: 2
title: キーや個人情報を、生成 AI のチャットに貼ったり、コーディング支援の AI に読ませたりしないと決めてある
when: []
risk: 名簿の整形をチャットの AI に頼んだり、コーディング支援の AI に .env を読まれたりすると、キーや個人情報が外部のサービスに送られます。設定によっては、学習に使われたり、相手のサービスに記録が残ったりします。
why: 何を AI に渡してよいかを先に決めておけば、便利さと引き換えに、知らないうちに漏らすことを防げます。
how:
  - text: 使っている AI サービスで、入力が学習に使われない設定になっているかを確かめます。
  - text: コーディング支援の AI には、.env など秘密の値が入ったファイルを読ませない設定をします（多くのツールに、読ませないファイルを指定する設定があります）。
  - text: 個人情報を AI で扱うときは、氏名や連絡先を取り除くか、置き換えてから渡します。
related: [ppcAi, ipa10]

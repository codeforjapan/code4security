id: paidapi
level: 1
title: 従量課金の API キーに、使える場所の制限と利用上限を付けた
when: [paidapi, ai, firebase]
risk: 地図や生成 AI、メール送信などの API キーが漏れたり、ブラウザから抜き取られたりすると、他人に使われて高額な請求が届きます。ブラウザで使うキーは、ページを開いた誰でも見られます。
why: キーに使えるドメインや IP アドレスの制限を付け、利用上限や予算アラートを設定しておけば、漏れても被害を小さく抑えられ、早く気づけます。
how:
  - text: Google Cloud なら、API キーの制限と、API ごとの割り当て（quota）の上限を設定します。予算アラートは通知だけで、使用は止まりません。生成 AI の API なら、各サービスの管理画面で利用上限を設定します。
  - text: Firebase なら、Firebase が作った API キーは Firebase の API だけに使い、Gemini や地図には別のキーを作って、使える API を絞ります。Firebase AI Logic や Cloud Functions などには、予算に達したら止める設定もあります。
related: [gcpKeys, gcpBudgets, owaspApi4, firebaseChecklist]
evidence:
  - source: firebaseChecklist
    checked: '2026-10-15'
    note: Gemini や地図には別のキーを使う。予算アラートと、予算に達したら止める設定がある

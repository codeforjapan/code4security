id: clientenv
level: 1
title: ブラウザに届く環境変数に、秘密の値を入れていない
when: [frontend]
risk: NEXT_PUBLIC_ や VITE_ で始まる環境変数は、ビルドのときにページの JavaScript へ埋め込まれます。秘密のキーを入れると、ページを開いた誰でも読めます。Supabase の secret キー（旧 service_role キー）なら、データベースを全件読み書きされます。
why: ブラウザに渡してよい値と、サーバーだけで使う値を分けておけば、知らないうちに公開してしまうことを防げます。
how:
  - command: |-
      grep -rnE '(NEXT_PUBLIC|VITE|EXPO_PUBLIC)_[A-Z0-9_]*(SECRET|TOKEN|PRIVATE|KEY|PASSWORD|SERVICE_ROLE)' \
        --exclude-dir={node_modules,.next,dist,build} .
  - text: Firebase の apiKey や Supabase の publishable キー（旧 anon キー）のように、ブラウザに出してよいキーも見つかります。見つかったものが本当に秘密の値かを確かめます。Firebase の apiKey は、使える API を Firebase のものに絞っておきます。
related: [nextEnv, viteEnv, supabaseKeys, firebaseKeys]
evidence:
  - source: supabaseKeys
    checked: '2026-10-15'
    note: secret キーは RLS を無視する
  - source: firebaseKeys
    checked: '2026-10-15'
    note: API キーには、使える API の制限をかける

id: pushprot
level: 1
title: キーを含むコミットを、push の前に止める仕組みがある
when: [public, private]
risk: API キーやパスワードをうっかりコミットして公開すると、数分で自動収集されて悪用されることがあります。クラウドの高額請求やデータの持ち出しにつながります。
why: push protection は、キーを含む push をその場で止めます。secret scanning は、すでに入ってしまったキーを見つけます。
how:
  - text: 公開リポジトリでは secret scanning が自動で動きますが、push protection はリポジトリごとに有効にします（既定では無効です）。
  - command: |-
      gh api -X PATCH repos/<owner>/<repo> \
        -f 'security_and_analysis[secret_scanning][status]=enabled' \
        -f 'security_and_analysis[secret_scanning_push_protection][status]=enabled'
how_for_private_repos:
  text: 個人アカウントや Free の organization の非公開リポジトリでは、push protection を使えません（organization が Team 以上のプランで GitHub Secret Protection を契約したときだけ使えます）。代わりに、gitleaks をコミットの前に動かして止めます。pre-commit を入れて（pip install pre-commit など）、リポジトリの直下に .pre-commit-config.yaml を置き、各自の手元で pre-commit install を一度実行します。
  command: |-
    repos:
      - repo: https://github.com/gitleaks/gitleaks
        rev: v8.30.1
        hooks:
          - id: gitleaks
related: [ghSecretScanning, ghPushProtection, ghPricing, gitleaks]

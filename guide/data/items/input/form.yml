id: form
level: 2
title: 誰でも送れるフォームや生成 AI の呼び出しに、bot 対策と回数の制限を入れた
when: [form, ai]
risk: 誰でも送れるフォームは bot に狙われ、大量のスパムが届いたり、通知メールの送信やデータベースの容量で費用が膨らんだりします。入力欄に攻撃用の文字列を送り込まれることもあります。生成 AI を呼び出すページも同じです。キーを隠していても、自分のサーバーの口を叩き続けられると、利用上限まで使い切られて止まったり、高額な請求が届いたりします。
why: bot 対策と、同じ送信元からの回数制限を入れれば、自動の大量送信を止められます。入力された値は、ブラウザ側だけでなくサーバー側でも必ず確かめます。生成 AI に渡す入力には、長さの上限も付けます。
how:
  - text: Cloudflare Turnstile などの bot 対策と、ホスティングやフレームワークの回数制限（レート制限）の機能
related: [turnstile, owaspInput, owaspLlm10]

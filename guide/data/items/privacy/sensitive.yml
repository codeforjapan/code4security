id: sensitive
level: 1
title: 健康・福祉・子どもなどの情報は、本人の同意を取って集め、見られる人を絞っている
when: [sensitive]
risk: 病歴や障害、子どもの情報が漏れると、本人への影響が大きく取り返しがつきません。病歴や障害などの要配慮個人情報は、1 人分の漏えい（そのおそれを含む）でも、原則として個人情報保護委員会への報告と本人への通知が必要です。
why: 集めるときは本人の同意を取ります（要配慮個人情報では原則として必要です）。見られる人を最小限にすれば、漏れる経路そのものが減ります。集める量と保存期間は、「集める個人情報を最小限にし、保存期間を決めた」の項目で見直します。
how:
  - text: この情報が入ったシートやデータベースを、誰が見られるかを一覧にし、必要のない人を外します。
related: [ppcGuideline, ppcLeak]

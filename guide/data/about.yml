# 点検表の説明。checklist.json などの冒頭に載る
name: はじめてのセキュリティ点検
description: 専任のセキュリティ担当がいないプロジェクト向けのセキュリティ点検。プロジェクトで使っているもの（conditions）を選ぶと、関係する点検項目（items）が決まる。各項目は、対策が済んだ状態を表す一文と、放っておいたときのリスク、対策が必要な理由、使えるツールやコマンドを持つ。
url: https://yokinist.github.io/first-security-checkup/
updated: '2026-10-15'
disclaimer: よくある穴を減らすための目安で、すべての項目を満たしても安全を保証するものではない。内容の正確さや完全さは保証せず、使ったことで生じた損害について作者は責任を負わない。調査と執筆に AI（Claude）を使っており、事実は資料で確かめているが、誤りが含まれることがある。個人情報を多く扱うときや、自治体などと契約して運用するときは、専門家による診断も検討する。

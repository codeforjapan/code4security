<!doctype html>
<!-- OGP 画像（ogp.png）の元。名前や見出しを変えたら、ブラウザで 1200×630 にして撮り直す -->
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@500;700&family=JetBrains+Mono:wght@400;700&display=block">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; box-sizing: border-box; padding: 56px 64px 52px; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto 1fr auto; gap: 0 56px; color: #e3e9f0; font-family: "IBM Plex Sans JP", sans-serif;
    background: radial-gradient(700px 420px at 85% -10%, rgb(78 227 138 / .14), transparent 60%), radial-gradient(circle, rgb(255 255 255 / .06) 1px, transparent 1.2px) 0 0 / 24px 24px, #090c10; }
  .path { display: flex; align-items: center; gap: 18px; font: 22px "JetBrains Mono", monospace; color: #4ee38a; }
  .main { align-self: center; }
  .name { font-size: 60px; font-weight: 700; line-height: 1.25; white-space: nowrap; }
  .question { margin-top: 22px; display: flex; align-items: center; font-size: 32px; font-weight: 700; color: #4ee38a; }
  .caret { width: 16px; height: 36px; margin-left: 10px; background: #4ee38a; box-shadow: 0 0 22px rgb(78 227 138 / .6); }
  .map { grid-column: 2; grid-row: 1 / 3; align-self: center; display: grid; gap: 8px; padding: 18px; border: 1.5px solid #2c3743; border-radius: 16px; background: linear-gradient(180deg, rgb(21 27 35 / .92), rgb(13 17 23 / .92)); }
  .map div { display: grid; grid-template-columns: repeat(var(--cols), 22px); gap: 7px; }
  .map i { width: 22px; height: 22px; box-sizing: border-box; border: 1.5px solid var(--c); border-radius: 5px; background: color-mix(in srgb, var(--c) 14%, transparent); }
  .map i.done { border-color: #4ee38a; background: #4ee38a; box-shadow: 0 0 12px rgb(78 227 138 / .55); }
  .flow { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5px; border: 1.5px solid #1f2731; border-radius: 14px; overflow: hidden; background: #1f2731; }
  .flow span { display: flex; align-items: center; gap: 14px; padding: 18px 22px; background: #0f141a; font-size: 22px; font-weight: 500; color: #aab6c4; white-space: nowrap; }
  .flow b { font: 700 20px "JetBrains Mono", monospace; color: #4ee38a; }
</style></head>
<body>
  <div class="path">~/your-project</div>
  <div class="main">
    <div class="name">はじめてのセキュリティ点検</div>
    <div class="question">そのプロジェクト、点検したことはありますか？<i class="caret"></i></div>
  </div>
  <div class="map" id="map"></div>
  <div class="flow"><span><b>01</b>当てはまるものを選ぶ</span><span><b>02</b>まずすべきことに対処する</span><span><b>03</b>自動で点検し続ける</span></div>
<script src="data.js"></script>
<script>
// 点検マップ（1 マス = 1 項目）。前半のカテゴリの「まずやる」を済みにして、進んでいる様子を見せる
const COLOR = { 1: "#ff6b6b", 2: "#ffbd52", 3: "#8f9cab" };
document.getElementById("map").style.setProperty("--cols", Math.max(...CATEGORIES.map(g => g.items.length)));
CATEGORIES.forEach((g, gi) => {
  const row = document.createElement("div");
  for (const it of g.items) {
    const c = document.createElement("i");
    c.style.setProperty("--c", COLOR[it.level]);
    if (gi < 5 && it.level === 1) c.className = "done";
    row.append(c);
  }
  document.getElementById("map").append(row);
});
</script>
</body></html>

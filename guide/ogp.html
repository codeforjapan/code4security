<!doctype html>
<!-- OGP 画像（ogp.png）の元。名前や見出しを変えたら、ブラウザで 1200×630 にして撮り直す -->
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=block">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; box-sizing: border-box; padding: 40px; background: #f3f5f8; font-family: "BIZ UDPGothic", sans-serif; color: #1a2233; }
  .panel { height: 100%; box-sizing: border-box; padding: 60px 64px 48px; border-radius: 24px; background: #e9effc; display: flex; flex-direction: column; }
  .for { align-self: flex-start; font-size: 24px; color: #3f4859; padding: 4px 18px; border-radius: 999px; background: #ffffff; }
  .main { margin-block: auto; }
  .name { font-size: 72px; font-weight: 700; line-height: 1.25; white-space: nowrap; }
  .question { margin-top: 24px; font-size: 34px; font-weight: 700; color: #2456d3; }
  .flow { padding-top: 26px; border-top: 2px solid rgba(36, 86, 211, .25); display: flex; gap: 36px; font-size: 24px; font-weight: 700; color: #3f4859; }
  .flow span { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  .num { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: #2456d3; color: #fff; font-size: 24px; }
</style></head>
<body><div class="panel">
  <div class="for">個人開発・シビックテック向け</div>
  <div class="main">
    <div class="name">はじめてのセキュリティ点検</div>
    <div class="question">そのプロジェクト、点検したことはありますか？</div>
  </div>
  <div class="flow"><span><b class="num">1</b>当てはまるものを選ぶ</span><span><b class="num">2</b>まずやることから片付ける</span><span><b class="num">3</b>自動で点検し続ける</span></div>
</div></body></html>

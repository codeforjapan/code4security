# checker/ のテスト（test_scan.py）を動かす
name: checker

on:
  push:
    branches: [main]
    paths: [checker/**, .github/workflows/checker.yml]
  pull_request:
    paths: [checker/**, .github/workflows/checker.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: checker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # scan.py は標準ライブラリだけを使うので、ランナーに入っている Python で動かす
      - run: python3 test_scan.py
